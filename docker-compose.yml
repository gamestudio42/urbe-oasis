services:
  game:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '5180:5180'
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm dev --host 0.0.0.0"
    environment:
      NODE_ENV: development

volumes:
  node_modules:
